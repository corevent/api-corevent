services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corevent-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: corevent_db
    volumes:
      - psql_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corevent_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  psql_data: